name: AI Linting Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write      # Required for OIDC authentication with Anthropic
  contents: write
  pull-requests: write

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0        # Moon needs full history for affected detection

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Install Moon
        run: |
          curl -fsSL https://moonrepo.dev/install/moon.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --prefix linting/markdown

      - name: Run linters on affected projects
        id: lint
        run: |
          set +e
          LINT_OUTPUT=$(moon run :lint --affected --base origin/${{ github.base_ref }} 2>&1)
          EXIT_CODE=$?
          set -e
          LINT_OUTPUT=$(echo "$LINT_OUTPUT" | sed 's|^\([a-zA-Z0-9_.-][^/: ]*\.md\):|linting/markdown/\1:|')
          if [ $EXIT_CODE -ne 0 ]; then
            echo "has_violations=true" >> $GITHUB_OUTPUT
            {
              echo "violations<<DELIMITER"
              echo "$LINT_OUTPUT"
              echo "DELIMITER"
            } >> $GITHUB_OUTPUT
          else
            echo "has_violations=false" >> $GITHUB_OUTPUT
          fi

      - name: Fix violations with Claude
        if: steps.lint.outputs.has_violations == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools Edit,Read,Write,Glob,Grep'
          prompt: |
            The markdownlint linter found the following violations in this PR:

            ${{ steps.lint.outputs.violations }}

            Please fix all reported violations. Only modify the files that contain violations — do not change anything else.

      - name: Commit and push fixes
        if: steps.lint.outputs.has_violations == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: address linting violations"
          git push
