name: AI Linting Fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0        # Moon needs full history for affected detection

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Moon
        run: |
          curl -fsSL https://moonrepo.dev/install/moon.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --prefix linting/markdown

      - name: Run linters on affected projects
        id: lint
        run: |
          set +e
          moon run :lint --affected --base origin/${{ github.base_ref }} 2>&1 | tee lint_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "has_violations=true" >> $GITHUB_OUTPUT
            {
              echo "violations<<DELIMITER"
              cat lint_output.txt
              echo "DELIMITER"
            } >> $GITHUB_OUTPUT
          else
            echo "has_violations=false" >> $GITHUB_OUTPUT
          fi

      - name: Fix violations with Claude
        if: steps.lint.outputs.has_violations == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The markdownlint linter found the following violations in this PR:

            ${{ steps.lint.outputs.violations }}

            Please fix all reported violations. Only modify the files that contain violations — do not change anything else.

      - name: Commit and push fixes
        if: steps.lint.outputs.has_violations == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: address linting violations"
          git push
